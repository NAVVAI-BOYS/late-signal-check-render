services:
  - type: web
    name: late-signal-check
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_TO
        sync: false
      - key: NOTIFY_FROM
        sync: false
    disk:
      name: leads
      mountPath: /var/data
      sizeGB: 1
